<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy Policy – Atelier Fichier</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="alternate" hreflang="en-US" href="https://regemathieu-hue.github.io/atelier-fichier/atelier-fichier/en-US/privacy.html">
  <link rel="alternate" hreflang="fr-FR" href="https://regemathieu-hue.github.io/atelier-fichier/atelier-fichier/fr-FR/privacy.html">
  <link rel="alternate" hreflang="x-default" href="https://regemathieu-hue.github.io/atelier-fichier/atelier-fichier/en-US/privacy.html">
  <script>
  (function () {
    var available = ["en-US", "fr-FR"];
    var fallback = "en-US";
    var langs = (navigator.languages || [navigator.language || ""]).map(String);
    var target = null;
    for (var i = 0; i < langs.length && !target; i++) {
      var l = langs[i];
      if (available.indexOf(l) >= 0) { target = l; break; }
      var base = l.split("-")[0];
      if (/^zh/i.test(l)) {
        var zh = /hant|tw|hk|mo/i.test(l) ? "zh-Hant" : "zh-Hans";
        if (available.indexOf(zh) >= 0) { target = zh; break; }
      }
      for (var j = 0; j < available.length; j++) {
        if (available[j].split("-")[0].toLowerCase() === base.toLowerCase()) { target = available[j]; break; }
      }
    }
    location.replace((target || fallback) + "/privacy.html");
  })();
  </script>
</head>
<body>
  <header><h1>Atelier Fichier</h1></header>
  <main>
    <h2>Privacy Policy</h2>
    <ul class="languages">
      <li><a href="en-US/privacy.html" hreflang="en-US" lang="en-US">English (US)</a></li>
      <li><a href="fr-FR/privacy.html" hreflang="fr-FR" lang="fr-FR">Français (France)</a></li>
    </ul>
  </main>
  <footer>Atelier Fichier · <a href="https://github.com/regemathieu-hue/atelier-fichier">Source code on GitHub</a></footer>
</body>
</html>
